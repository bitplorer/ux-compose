name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  full-stack:
    name: full-stack (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install specialists + package
        run: |
          python -m pip install -U pip setuptools wheel
          pip install pytest
          pip install "ux-behavior @ git+https://github.com/bitplorer/ux-behavior.git@76adc72ff8e8d2f6a784d8b988b720934bd8a612"
          pip install "ux-motion @ git+https://github.com/bitplorer/ux-motion.git@67ff3f0c4912b70b7056f8226a6f226b6fe93f60"
          pip install "ux-channel @ git+https://github.com/bitplorer/ux-channel.git@31a60bdd40a1b52aea1fd13159ad09c293c63fd6#subdirectory=python"
          pip install "ux-dom @ git+https://github.com/bitplorer/ux-dom.git@25338a6d624b764bb79615de52fca48084ce2c55"
          pip install "cek-host>=0.1.3" "cek-surface>=0.1.3"
          pip install fastapi uvicorn httpx
          pip install -e .
      # Sibling live repro is optional and not required here:
      # make cek-repro-morph-shell → ../cek-auto-suite/repro_morph_shell.py
      # (do not import ux_channel from product).
      - name: Full suite
        run: python -m pytest tests/ -q
      - name: Nested-shell fragment-law
        run: python -m pytest tests/feature -q -m cto_red --tb=short
