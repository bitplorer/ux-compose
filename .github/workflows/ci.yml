name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  full-stack:
    name: full-stack (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # setup-uv v10.2.0 (2026-09-21) and uv 0.12.23 (2026-10-03) are both
      # older than 14 days as of 2026-10-19. uv is a workflow tool, not a
      # project distribution. Cache stays off so a warm wheel cache cannot
      # skip the cutoff.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Dependency cooldown cutoff
        id: cooldown
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"
          echo "uv exclude-newer cutoff (14 days before this run): $cutoff"
      - name: Install specialists + package
        env:
          UV_EXCLUDE_NEWER: ${{ steps.cooldown.outputs.cutoff }}
        run: |
          python_bin="$(python -c 'import sys; print(sys.executable)')"
          uv venv "$RUNNER_TEMP/cooldown-venv" --python "$python_bin"
          venv="$RUNNER_TEMP/cooldown-venv/bin/python"
          # Every registry resolve uses --exclude-newer. Git SHA siblings
          # (ux-dom, ux-channel, ux-behavior, ux-motion) stay pinned; their
          # PyPI dependencies honor the same cutoff.
          uv pip install --python "$venv" --exclude-newer "$UV_EXCLUDE_NEWER" \
            --reinstall pip setuptools wheel
          uv pip install --python "$venv" --exclude-newer "$UV_EXCLUDE_NEWER" \
            -e ".[dev]"
          # DELIBERATE RED. Revert this commit. fastapi 0.148.0 is outside the
          # 14-day cutoff; the cooldown check must fail and name it.
          env -u UV_EXCLUDE_NEWER uv pip install --python "$venv" "fastapi==0.148.0"
          echo "$RUNNER_TEMP/cooldown-venv/bin" >> "$GITHUB_PATH"
          "$venv" -c "from importlib.metadata import version; print('resolved fastapi', version('fastapi'))"
      # Sibling live repro is optional and not required here:
      # make cek-repro-morph-shell → ../cek-auto-suite/repro_morph_shell.py
      # (do not import ux_channel from product).
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
      - name: Chrome version
        run: python scripts/chrome_floor.py "$(command -v google-chrome)"
      - name: Dependency cooldown check
        run: python ci/check_dependency_cooldown.py
      - name: Full suite
        env:
          UX_KEEP_VALUE_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/ -q
      - name: X1 Chrome keep-value
        env:
          UX_KEEP_VALUE_REQUIRE_BROWSER: "1"
        run: |
          python -m pytest tests/security/test_login_typed_password.py -v -rs --tb=short --junitxml=/tmp/x1-chrome.xml
          python << 'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/x1-chrome.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = skipped = failures = errors = 0
          for suite in suites:
              tests += int(suite.get("tests", "0"))
              skipped += int(suite.get("skipped", "0"))
              failures += int(suite.get("failures", "0"))
              errors += int(suite.get("errors", "0"))
          passed = tests - skipped - failures - errors
          print(f"X1 Chrome: {passed} passed, {skipped} skipped")
          raise SystemExit(0 if skipped == 0 and failures == 0 and errors == 0 and passed == 4 else 1)
          PY
      - name: Nested-shell fragment-law
        run: python -m pytest tests/feature -q -m cto_red --tb=short
