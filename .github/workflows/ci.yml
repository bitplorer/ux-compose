name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-shim:
    name: offline-shim (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + pytest
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e . pytest
      - name: Offline tests (no specialists required)
        run: |
          python -m pytest tests/test_offline.py tests/test_offline_cart.py tests/test_doctor_laws.py tests/test_cold_isolation.py tests/test_return_algebra.py tests/test_xor_helpers.py -q

  full-stack:
    name: full-stack (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install specialists + package
        run: |
          python -m pip install -U pip setuptools wheel
          pip install pytest
          pip install "ux-behavior @ git+https://github.com/bitplorer/ux-behavior.git"
          pip install "ux-motion @ git+https://github.com/bitplorer/ux-motion.git"
          pip install "ux-channel @ git+https://github.com/bitplorer/ux-channel.git#subdirectory=python"
          pip install "ux-dom @ git+https://github.com/bitplorer/ux-dom.git"
          pip install fastapi uvicorn httpx
          pip install httpx2 || true
          pip install -e .
      - name: Full suite
        run: python -m pytest tests/ -q
