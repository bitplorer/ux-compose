[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-compose"
version = "0.1.0"
description = "Pure-Python composition root that harnesses pinned ux-dom + ux-behavior + ux-motion + ux-channel (hard dependencies, Python ≥3.14) into an isolation-enforced, server-driven hypermedia framework with additive levels 0–3."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "bitplorer"}]
keywords = ["ux", "hypermedia", "server-driven", "python", "composition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "ux-dom @ git+https://github.com/bitplorer/ux-dom.git@e8be99a52bfecd6026c200fa1c3dc6a74f87aacb",
    "ux-channel @ git+https://github.com/bitplorer/ux-channel.git@985e58aee76ca683774c4d4d58ab30a1d3b6efee#subdirectory=python",
    "ux-behavior @ git+https://github.com/bitplorer/ux-behavior.git@793f120e3b1388925772cd069b070d7918b78baa",
    "ux-motion @ git+https://github.com/bitplorer/ux-motion.git@67ff3f0c4912b70b7056f8226a6f226b6fe93f60",
    "cek-host>=0.1.3",
    "cek-surface>=0.1.3",
]

[project.optional-dependencies]
# Specialists are hard dependencies (see [project].dependencies). These extras
# remain as no-op aliases so existing `pip install -e ".[full]"` commands
# do not fail closed on a missing extra name.
dom = []
behavior = []
motion = []
channel = []
full = []
# serve extra is only for `uxcompose serve dev`:
#   httpx      public process re-issues HTTP to workers
#   starlette  public ASGI app
#   websockets public process forwards HMR + Channel sockets
#   watchfiles uvicorn reloader that honors --reload-exclude *.css
serve = ["uvicorn", "watchfiles", "httpx", "starlette", "websockets"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx", "fastapi", "uvicorn", "watchfiles", "starlette", "websockets"]

[project.scripts]
uxcompose = "ux_compose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ux_compose = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: longer stress tests",
    "live: needs fastapi / specialists",
    "cto_red: nested-shell / fragment-law (FullShellHello characterization)",
]

[tool.coverage.run]
source = ["ux_compose"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
