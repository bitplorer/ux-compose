name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  full-stack:
    name: full-stack (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install specialists + package
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
      # Sibling live repro is optional and not required here:
      # make cek-repro-morph-shell → ../cek-auto-suite/repro_morph_shell.py
      # (do not import ux_channel from product).
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
      - name: Chrome version
        run: |
          google-chrome --version
          python << 'PY'
          import re
          import subprocess
          import sys
          text = subprocess.check_output(["google-chrome", "--version"], text=True).strip()
          print(text)
          match = re.search(r"(\d+)\.", text)
          major = int(match.group(1)) if match else 0
          print(f"Chrome major: {major}")
          if major < 155:
              sys.exit(f"Chrome {major} is below 155")
          PY
      - name: Full suite
        env:
          UX_KEEP_VALUE_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/ -q
      - name: X1 Chrome keep-value
        env:
          UX_KEEP_VALUE_REQUIRE_BROWSER: "1"
        run: |
          python -m pytest tests/security/test_login_typed_password.py -v -rs --tb=short --junitxml=/tmp/x1-chrome.xml
          python << 'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/x1-chrome.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = skipped = failures = errors = 0
          for suite in suites:
              tests += int(suite.get("tests", "0"))
              skipped += int(suite.get("skipped", "0"))
              failures += int(suite.get("failures", "0"))
              errors += int(suite.get("errors", "0"))
          passed = tests - skipped - failures - errors
          print(f"X1 Chrome: {passed} passed, {skipped} skipped")
          raise SystemExit(0 if skipped == 0 and failures == 0 and errors == 0 and passed == 4 else 1)
          PY
      - name: Nested-shell fragment-law
        run: python -m pytest tests/feature -q -m cto_red --tb=short
