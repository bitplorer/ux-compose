[pytest]
testpaths = tests
pythonpath = src .
# pytest-randomly ships in the dev extra. Keep the suite ordered.
# The host-isolation CI step opts back in with -p randomly.
addopts = -p no:randomly
markers =
    slow: longer stress tests
    live: needs fastapi / specialists
    cto_red: nested-shell / fragment-law (FullShellHello characterization)
    real_smoke_import: run package._smoke_import for real in test_cli_package.py
    import_isolation: deterministic package-import tests; pytest-randomly must not reorder them
filterwarnings =
    ignore::DeprecationWarning
