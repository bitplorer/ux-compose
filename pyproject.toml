[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-compose"
version = "0.1.0"
description = "Pure-Python composition root that fully harnesses ux-dom + ux-behavior + ux-motion + ux-channel into a progressive, isolation-enforced, server-driven hypermedia framework."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "bitplorer"}]
keywords = ["ux", "hypermedia", "server-driven", "python", "composition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dom = ["ux-dom"]
behavior = ["ux-behavior"]
motion = ["ux-motion"]
channel = ["ux-channel"]
full = ["ux-dom", "ux-behavior", "ux-motion", "ux-channel"]
# serve extra is only for `uxcompose serve dev`:
#   httpx      public process re-issues HTTP to workers
#   starlette  public ASGI app
#   websockets public process forwards HMR + Channel sockets
#   watchfiles uvicorn reloader that honors --reload-exclude *.css
serve = ["uvicorn", "watchfiles", "httpx", "starlette", "websockets"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx", "fastapi", "uvicorn", "watchfiles", "starlette", "websockets"]

[project.scripts]
uxcompose = "ux_compose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ux_compose = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: longer stress tests",
    "live: needs fastapi / specialists",
]

[tool.coverage.run]
source = ["ux_compose"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
