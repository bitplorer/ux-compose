[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-compose"
version = "0.2.0"
description = "Pure-Python composition root that harnesses pinned ux-dom + ux-behavior + ux-motion + ux-channel (hard dependencies, Python ≥3.14) into an isolation-enforced, server-driven hypermedia framework with additive levels 0–3."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "bitplorer"}]
keywords = ["ux", "hypermedia", "server-driven", "python", "composition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "ux-dom @ git+https://github.com/bitplorer/ux-dom.git@0440ccbf9b9a53a0ba11ae43b3d04b6079b330f4",
    "ux-channel @ git+https://github.com/bitplorer/ux-channel.git@133d3cb1cebfd8e6c3177e59bac077e925150d72#subdirectory=python",
    "ux-behavior @ git+https://github.com/bitplorer/ux-behavior.git@09a9a658e7dbd06f51acf6104a85c3ba608dfe7a",
    "ux-motion @ git+https://github.com/bitplorer/ux-motion.git@bbe7d73466a6c1eccb47e711568c80ce3b4d5487",
    "cek-host>=0.2.0",
    "cek-surface>=0.2.0",
    # HTTP host stack: routing/fastapi.py, routing/asgi.py and `uxcompose serve`
    # import these directly. Declared so a plain install can serve.
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# serve extra is only for `uxcompose serve dev`:
#   httpx      public process re-issues HTTP to workers
#   starlette  public ASGI app
#   websockets public process forwards HMR + Channel sockets
#   watchfiles uvicorn reloader that honors --reload-exclude *.css
serve = ["uvicorn", "watchfiles", "httpx", "starlette", "websockets"]
dev = ["pytest", "ruff", "pytest-asyncio", "pytest-cov", "httpx", "fastapi", "uvicorn", "watchfiles", "starlette", "websockets"]

[project.scripts]
uxcompose = "ux_compose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ux_compose = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: longer stress tests",
    "live: needs fastapi / specialists",
    "cto_red: nested-shell / fragment-law (FullShellHello characterization)",
]

[tool.coverage.run]
source = ["ux_compose"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
